name: Atualizar relatório de contribuições

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  atualizar-relatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar relatório
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar_contribuicoes.py

      - name: Salvar README atualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: atualizar relatório de contribuições"
          file_pattern: README.md